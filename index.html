<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Score Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Credit Score Prediction</h1>
        <p>Please enter your financial details to predict your credit score.</p>
        
        <form action="/predict" method="post">
            <label>Age</label>
            <input type="number" step="any" name="feature1" placeholder="Enter your age" required>

            <label>Annual Income</label>
            <input type="number" step="any" name="feature2" placeholder="Total yearly income" required>

            <label>Monthly Inhand Salary</label>
            <input type="number" step="any" name="feature3" placeholder="Salary you take home" required>

            <label>Number of Bank Accounts</label>
            <input type="number" step="any" name="feature4" placeholder="How many accounts you hold" required>

            <label>Number of Credit Cards</label>
            <input type="number" step="any" name="feature5" placeholder="How many credit cards you use" required>

            <label>Interest Rate (%)</label>
            <input type="number" step="any" name="feature6" placeholder="Average loan/credit interest rate" required>

            <label>Number of Loans</label>
            <input type="number" step="any" name="feature7" placeholder="Active loans count" required>

            <label>Delay from Due Date (days)</label>
            <input type="number" step="any" name="feature8" placeholder="Average delay in payments" required>

            <label>Number of Delayed Payments</label>
            <input type="number" step="any" name="feature9" placeholder="Count of past delays" required>

            <label>Changed Credit Limit</label>
            <input type="number" step="any" name="feature10" placeholder="Recent change in credit limit" required>

            <label>Number of Credit Inquiries</label>
            <input type="number" step="any" name="feature11" placeholder="How many times you applied for credit" required>

            <label>Outstanding Debt</label>
            <input type="number" step="any" name="feature12" placeholder="Unpaid debt amount" required>

            <label>Credit Utilization Ratio (%)</label>
            <input type="number" step="any" name="feature13" placeholder="How much of credit limit used" required>

            <label>Credit History Age (months)</label>
            <input type="number" step="any" name="feature14" placeholder="Age of credit history" required>

            <label>Payment of Minimum Amount (1=Yes, 0=No)</label>
            <input type="number" step="any" name="feature15" placeholder="Do you pay minimum balance?" required>

            <label>Total EMI per Month</label>
            <input type="number" step="any" name="feature16" placeholder="Sum of EMIs" required>

            <label>Amount Invested Monthly</label>
            <input type="number" step="any" name="feature17" placeholder="How much you invest per month" required>

            <label>Monthly Balance</label>
            <input type="number" step="any" name="feature18" placeholder="Remaining balance after expenses" required>

            <button type="submit">Predict</button>
        </form>

        {% if prediction_text %}
        <div class="result">
            <h2>{{ prediction_text }}</h2>
        </div>
        {% endif %}
    </div>
</body>
</html>
